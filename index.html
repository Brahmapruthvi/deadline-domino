<script>
const KEY='dd2',$=s=>document.querySelector(s),X=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({k:{room:'Room 56',arr:'10:00'},p:{room:'Room 65',time:'11:00'},sel:0,msgs:[
{id:1,from:'Priya Nair (Lead Organizer)',auth:1,src:'Email',text:"The keynote speaker's arrival has moved to 11:00 AM. The keynote will take place in Room 65 instead of Room 56.",st:'new'},
{id:2,from:'Venue AV vendor',auth:1,src:'Vendor message',text:"Room 65's AV setup is not complete.",st:'new'},
{id:3,from:'Unverified attendee',auth:0,src:'Imported chat',text:'Heard the keynote is now in Room 70 at 12 PM!',st:'new'}],props:[],notes:[],log:[{t:Date.now(),m:'Event workspace loaded: Global Leadership Summit (illustrative) — 500 participants, 8 teams'}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},log=m=>{S.log.unshift({t:Date.now(),m})};
let tab='inbox',err='',scen=0;
const toast=m=>{const t=document.createElement('div');t.className='tt';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)};
const to24=(h,m,ap)=>{h=+h%12+(/pm/i.test(ap)?12:0);return String(h).padStart(2,'0')+':'+(m||'00')},fm=t=>{let[h,m]=t.split(':');h=+h;return((h%12)||12)+':'+m+(h>=12?' PM':' AM')};
// ---- intelligence: language layer (rules) → event engine (validate) → impact ----
function analyze(m){const T=m.text,tm=T.match(/(\d{1,2})(?::(\d\d))?\s*(am|pm)/i),rm=[...T.matchAll(/room\s*(\d+)/ig)].map(x=>'Room '+x[1]);
 const p={id:Date.now(),mid:m.id,from:m.from,src:m.src,ch:[],conf:[],unc:[],rec:[],risk:'',status:'pending'};
 if(/arriv|reach|delay|late/i.test(T)&&tm){const to=to24(tm[1],tm[2],tm[3]);if(to!==S.k.arr)p.ch.push({k:'arr',label:'Speaker arrival',from:S.k.arr,to})}
 const dest=/instead of|not in|moved to|take place in|move/i.test(T)&&rm.length?rm[0]:null;
 if(dest&&dest!==S.k.room)p.ch.push({k:'room',label:'Keynote room',from:S.k.room,to:dest});
 if(/not complete|not ready|issue|broken|missing/i.test(T)&&rm.length){p.risk=rm[0]+' readiness risk reported: "'+T+'"';p.rec.push({to:'AV team',n:1,crit:1,txt:'Vendor reports '+rm[0]+' AV setup is incomplete. Confirm readiness plan before the keynote.'},{to:'Event operations',n:1,crit:1,txt:'Open risk: '+rm[0]+' AV setup incomplete. Monitor and escalate if unresolved.'})}
 if(!m.auth){p.conf.push('Sender is not authorized to change the approved plan — change cannot be applied. Verify with an authorized organizer.');p.blocked=1}
 if(!p.ch.length&&!p.risk)p.unc.push('No actionable change or risk found in this message.');
 if(p.ch.some(c=>c.k=='arr'&&tm&&!tm[3]))p.unc.push('AM/PM ambiguous');
 const nr=(p.ch.find(c=>c.k=='room')||{}).to||S.k.room,na=(p.ch.find(c=>c.k=='arr')||{}).to||S.k.arr;
 if(p.ch.length&&nr==S.p.room&&na.slice(0,2)==S.p.time.slice(0,2))p.conf.push(nr+' is already booked for "Panel: Future of Work" at '+fm(S.p.time)+'. Resolve before approving.');
 if(p.ch.length&&!p.blocked){const room=p.ch.some(c=>c.k=='room'),arr=p.ch.some(c=>c.k=='arr');
  p.rec.push({to:'Keynote attendees',n:180,crit:1,txt:'Update: the keynote is '+(room?'now in '+nr:'in '+S.k.room)+(arr?', starting around '+fm(na):'')+'. Please follow the revised plan.'});
  if(room)p.rec.push({to:'AV team',n:1,crit:1,txt:'Check equipment availability in '+nr+' and move the keynote setup from '+S.k.room+'.'});
  if(arr)p.rec.push({to:'Transport team',n:1,crit:1,txt:'Speaker arrival is now '+fm(na)+' (was '+fm(S.k.arr)+'). Revise pickup and reception.'},{to:'Catering team',n:1,crit:0,rev:1,txt:'Suggested: review whether service timing near the keynote should shift. Not auto-changed.'});
  p.rec.push({to:'Event operations',n:1,crit:0,txt:'Track acknowledgments and resolve open conflicts for this change.'})}
 S.props.unshift(p);m.st=p.blocked?'flagged':'analyzed';S.sel=p.id;log('Extracted from '+m.src+' by '+m.from+': '+(p.ch.map(c=>c.label).join(', ')||p.risk&&'risk report'||'nothing actionable')+(p.blocked?' — blocked (unauthorized sender)':' — awaiting approval'))}
function approve(p){p.status='approved';p.ch.forEach(c=>S.k[c.k]=c.to);p.rec.forEach(r=>S.notes.push({id:Math.random(),pid:p.id,...r,ack:0}));S.msgs.find(m=>m.id==p.mid).st='applied';log('Approved by Event Director: '+(p.ch.map(c=>c.label+' '+c.from+' → '+c.to).join('; ')||'risk escalation')+'. Source: '+p.src+' / '+p.from+'. '+p.rec.length+' targeted notifications queued')}
const open=()=>S.props.filter(p=>p.status=='pending'&&!p.blocked);
function graph(p){const nodes=p.rec.map(r=>r.to),all=[...nodes,'Other delegates (320)'],W=620,pts=all.map((n,i)=>[60+i*(W-120)/Math.max(all.length-1,1),230]);
 return`<svg viewBox="0 0 ${W} 280" style="width:100%;max-width:700px" role="img" aria-label="Dependency impact graph"><g><rect x="${W/2-70}" y="20" width="140" height="44" fill="var(--navy)" stroke="var(--gold)"/><text x="${W/2}" y="40" text-anchor="middle" fill="#FFB547" font-size="12">Keynote session</text><text x="${W/2}" y="55" text-anchor="middle" fill="#FFF7EE" font-size="10">${X(S.k.room)} · ${fm(S.k.arr)}</text></g>${all.map((n,i)=>{const un=i==all.length-1;return`<line class="ln" style="animation-delay:${i*.15}s" x1="${W/2}" y1="64" x2="${pts[i][0]}" y2="212" ${un?'stroke-dasharray="4 4" opacity=".35"':''}/><g class="d" style="animation-delay:${.3+i*.15}s"><rect x="${pts[i][0]-52}" y="212" width="104" height="36" fill="var(--pn)" stroke="${un?'var(--ln)':'var(--gold)'}"/><text x="${pts[i][0]}" y="234" text-anchor="middle" font-size="10.5" fill="${un?'var(--mu)':'var(--fg)'}">${X(n.length>20?n.slice(0,18)+'…':n)}</text></g>`}).join('')}</svg>`}
const P={
home:()=>`<section class="f hero"><div class="eb">Event operations intelligence · B2B SaaS <span class="ai">✦ AI-powered</span></div><h1>One Change.<br>Every Team in Sync.</h1><p class="lead">When a speaker slips by an hour and the keynote moves rooms, someone has to work out who needs to know what. Deadline Domino understands the change, traces its consequences, and coordinates the response — with a human approving anything that matters.</p><p><a class="btn" href="#/demo">Explore the live demo</a> <a class="btn g" href="#/product">How it works</a></p>
<div class="dm" aria-label="A change tipping dependent teams">${['Speaker arrival','Room change','AV setup','Transport','Catering','Attendees','Confirmed'].map((x,i)=>`<div style="--i:${i}">${x}</div>`).join('')}</div></section>
<section><div class="eb">The problem</div><h2>The plan isn't a schedule. It's a network.</h2><p class="lead">The master schedule lives in a spreadsheet, the arrival update in an email, the room change in a chat group, catering in its own document. Nobody holds the current truth.</p><div class="cols" style="margin-top:36px">${[['Fragmented information','No single view reflects the whole situation.'],['The domino effect','A delayed speaker touches transport, rehearsal, timing, catering and the next session.'],['Wrong people informed','Some follow the old plan; others get messages that don\'t concern them.'],['Teams in silos','Each team efficient alone, none sharing the operational picture.'],['Events already in chaos','Agencies arrive mid-planning with 300 emails and five spreadsheets.']].map((a,i)=>`<div class="it"><span class="n">0${i+1}</span><b>${a[0]}</b><span class="mu">${a[1]}</span></div>`).join('')}</div></section>
<section><div class="eb">Illustrative scenario · Global Leadership Summit · 500 participants · 8 teams</div><h2>Watch one message become coordinated action.</h2><div class="q">"The keynote speaker's arrival has moved to 11:00 AM. The keynote will take place in Room 65 instead of Room 56."</div><button class="btn" data-a="scen">${scen?'Replay':'Process this update'}</button>
${scen?`<div style="margin-top:26px">${[['Proposed changes','Arrival 10:00 → 11:00 · Room 56 → Room 65','Extracted'],['Keynote attendees (180)','Revised room and schedule','Proposed · needs approval'],['AV team','Check Room 65 equipment; revise setup','Proposed · needs approval'],['Transport team','Update speaker pickup and reception','Proposed · needs approval'],['Catering team','Review timing — never auto-rescheduled','Suggestion only'],['Other delegates (320)','Unrelated sessions — no message','Not notified']].map((r,i)=>`<div class="row d" style="animation-delay:${i*.3}s"><div><b>${r[0]}</b><div class="mu">${r[1]}</div></div><span class="tg ${i==5?'':'p'}">${r[2]}</span></div>`).join('')}<p class="mu">Then the engine checks for conflicts. <a href="#/demo">Run it yourself — it finds one.</a></p></div>`:''}</section>`,
product:()=>`<section class="f"><div class="eb">Product</div><h1>A coordination layer, not another event app.</h1><p class="lead">It sits over the tools you already use. Registration and ticketing aren't our priority; understanding change is.</p></section>
<section><h2>Two ways in, one engine</h2><div class="cols"><div class="pn"><h3>A · Create and manage</h3><p class="mu">Plan in Deadline Domino from the first meeting: sessions, rooms, speakers, vendors, teams, responsibilities. Every change updates one shared operational plan.</p></div><div class="pn"><h3>B · Recover an existing event</h3><p class="mu">Import authorized emails, messages and spreadsheets. AI proposes a structured plan, highlights contradictions and missing details. The organizer verifies it before it becomes truth.</p></div></div></section>
<section><h2>Six steps, fully traceable</h2>${[['Information arrives','Organizer input, authorized email, supported messaging, documents.'],['AI interprets it','People, times, rooms, changes, source and uncertainty.'],['The engine validates it','Authority, current values, conflicts, resource availability.'],['Impact is calculated','Attendees, sessions, teams, vendors and tasks affected.'],['Organizer approves','Recommendations stay separate from confirmed decisions.'],['Updates delivered and tracked','Right people notified; acknowledgments and open actions monitored.']].map((a,i)=>`<div class="row"><div><span class="n">0${i+1}</span> <b>${a[0]}</b></div><span class="mu" style="max-width:520px">${a[1]}</span></div>`).join('')}<p class="mu">Every change answers: what changed, who said it, was it verified, who approved it, who was affected, who has not acknowledged, what remains open.</p></section>
<section><h2>Four layers of intelligence</h2><div class="cols">${[['Language','Reads messages, extracts proposed changes, recognizes entities.'],['Event','Structured relationships between people, sessions, rooms, vendors and duties.'],['Impact','Traces dependencies to find what a change touches.'],['Execution','Approvals, notifications, acknowledgments, retries, escalation.']].map(a=>`<div class="it"><b>${a[0]}</b><span class="mu">${a[1]}</span></div>`).join('')}</div><p class="lead">The model can understand that a speaker is late. It does not decide to reschedule the conference — the event engine checks dependencies and the organizer decides.</p></section>
<section><h2>Source of truth, not latest message</h2><p class="lead">One approved plan per event. A recent message from an unauthorized sender never outranks an approved instruction; conflicting sources are flagged, not guessed.</p><h3 style="margin-top:30px">Channels, in build order</h3><div class="tw"><table><tr><th>Channel</th><th>Approach</th></tr>${[['Manual input and files','PDFs, spreadsheets, organizer entries — first'],['Gmail / Outlook','Authorized account connection via supported APIs'],['WhatsApp / SMS','Supported business interfaces or explicitly imported messages'],['Phone calls','Authorized transcripts or supported telephony'],['Event platforms','APIs or imports where available']].map(r=>`<tr><td>${r[0]}</td><td class="mu">${r[1]}</td></tr>`).join('')}</table></div><p class="mu">Authorizing one service never grants access to every private message.</p></section>`,
business:()=>`<section class="f"><div class="eb">Business · hypotheses to validate, not forecasts</div><h1>Who pays, and why.</h1><p class="lead">Start with event-management agencies running complex corporate events: one agency runs many events a year, so value can be proven repeatedly.</p></section>
<section><h2>Who's in the room</h2><div class="tw"><table><tr><th>Role</th><th>Example</th></tr>${[['Economic buyer','Agency owner or corporate operations director'],['Primary user','Event director, operations manager'],['Operational user','AV lead, catering, transport, security'],['Participant','Speaker, VIP, attendee, vendor'],['IT / compliance','Security and procurement']].map(r=>`<tr><td>${r[0]}</td><td class="mu">${r[1]}</td></tr>`).join('')}</table></div></section>
<section><h2>Revenue streams to test</h2><div class="cols"><div class="pn"><h3>Per-event</h3><p class="mu">Priced on complexity, duration, participants, features. For irregular organizers.</p></div><div class="pn"><h3>Agency subscription</h3><p class="mu">Monthly or annual for many events, clients and reusable workflows. Preferred first test.</p></div><div class="pn"><h3>Enterprise</h3><p class="mu">Integrations, permissions, auditability, support, security requirements.</p></div></div>
<h3 style="margin-top:40px">Agency plan sensitivity</h3><label for="pr">Illustrative price per agency per month (₹)</label><input id="pr" type="number" min="1000" step="1000" value="${S.pr||10000}" style="max-width:220px"><div class="tw" id="rv" style="margin-top:14px"></div><p class="mu">Excludes churn, discounts, tax and costs (AI, messaging, hosting, support, acquisition).</p></section>
<section><h2>Competition</h2><p class="lead">Cvent, Whova, Bizzabo, Eventbrite, Microsoft Teams and Slack overlap in parts. We haven't verified what each does today; we claim no gaps until we've investigated. Positioning: the layer that works with existing tools, focused on change and its consequences.</p></section>
<section><h2>Phased build</h2>${[['Prototype','Simulated inbox, event data, extraction, change review, basic impact — this demo'],['MVP','Real records, dependency checks, approvals, targeted notifications'],['Integrations','Authorized email, one messaging channel, live pilots'],['Commercial','Subscriptions, multi-event, billing, permissions'],['Scale','Enterprise integrations, predictive risk, multilingual workflows']].map((a,i)=>`<div class="row"><div><span class="n">PHASE ${i+1}</span> <b>${a[0]}</b></div><span class="mu" style="max-width:520px">${a[1]}</span></div>`).join('')}</section>
<section><h2>Risks we take seriously</h2><div class="tw"><table><tr><th>Risk</th><th>Response</th></tr>${[['AI misreads a message','Source evidence, validation, human review'],['Wrong recipients','Explicit audience rules, recipient validation'],['Integration fails','Retries, delivery status, fallback channels'],['Customer data exposed','Tenant isolation, encryption, access controls'],['Incumbents add features','Depth of workflow and execution quality'],['Customers won\'t pay','Paid pilots, willingness-to-pay tests']].map(r=>`<tr><td>${r[0]}</td><td class="mu">${r[1]}</td></tr>`).join('')}</table></div><p class="mu">A missed critical update is a reliability incident, not a minor AI error.</p></section>`,

$('#mb').onclick=e=>e.target.setAttribute('aria-expanded',$('#lk').classList.toggle('open'));
document.addEventListener('input',e=>{if(e.target.id=='pr'){S.pr=+e.target.value;save();rv()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,p=S.props.find(x=>x.id==i);
 if(a=='scen')scen=1;else if(a=='tab')tab=b.dataset.v;
 else if(a=='an'){analyze(S.msgs.find(m=>m.id==i));tab='review';toast('Changes extracted — review before anything is applied')}
 else if(a=='add'){const t=$('#mt').value.trim(),f=$('#mf').value;if(t.length<8){err='Enter a message of at least 8 characters.';render();return}err='';S.msgs.push({id:Date.now(),from:f=='1'?'Lead Organizer':f=='1v'?'Venue vendor':'Unverified participant',auth:f!='0'?1:0,src:'Imported message',text:t,st:'new'});log('Message imported: "'+t.slice(0,50)+'"');toast('Added to inbox')}
 else if(a=='ap'){approve(p);tab='notif';toast('Approved — targeted notifications generated')}
 else if(a=='rj'){p.status='rejected';log((p.blocked?'Dismissed':'Rejected')+' proposal from '+p.from);S.msgs.find(m=>m.id==p.mid).st='rejected'}
 else if(a=='fix'){S.p.room='Room 12';p.conf=p.conf.filter(c=>!c.includes('already booked'));log('Conflict resolved: Panel moved to Room 12 (organizer decision)');toast('Conflict resolved')}
 else if(a=='sel'){S.sel=p.id;tab='impact'}
 else if(a=='ack'){const n=S.notes.find(x=>x.id==i);n.ack=1;log('Acknowledged: '+n.to)}
 else if(a=='reset'){S=seed();toast('Demo reset')}
 save();render()});
render();
</script></body></html>
